<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<style>
  /* Container Utama */
  .input-container {
    display: flex;
    align-items: center;
    background-color: #000000;
    border: 2px solid #ffffff;
    border-radius: 6px;
    padding: 6px;
    width: 100%;
    max-width: 450px;
    /* Efek Bayangan 3D sesuai gambar */
    box-shadow: 5px 5px 0px 0px #ffffff;
    position: relative;
  }

  /* Kolom Input */
  .input-container input {
    flex: 1;
    background: transparent;
    border: none;
    color: #ffffff;
    font-family: sans-serif;
    font-size: 16px;
    padding: 10px 15px;
    outline: none;
  }

  .input-container input::placeholder {
    color: #a0a0a0;
  }

  /* Tombol Lingkaran Hijau */
  .input-container button {
    background-color: #00e676;
    /* Warna hijau terang */
    border: none;
    border-radius: 50%;
    width: 42px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.1s ease, background-color 0.2s;
    flex-shrink: 0;
    /* Mencegah tombol gepeng */
  }

  /* Efek Hover & Active */
  .input-container button:hover {
    background-color: #00c853;
  }

  .input-container button:active {
    transform: scale(0.95);
  }

  /* Ikon di dalam tombol */
  .icon-send {
    width: 20px;
    height: 20px;
    fill: #000000;
    transform: rotate(-30deg);
    /* Opsional: sedikit dimiringkan agar dinamis */
  }
</style>

<body>
  <form class="newsletter-form">
    <div class="input-container">
      <!-- Label disembunyikan secara visual tetapi terbaca oleh Screen Reader -->
      <label for="email" class="sr-only">Alamat Email</label>

      <input type="email" id="email" placeholder="Enter your email here" required />

      <button type="submit" aria-label="Kirim email">
        <!-- SVG Ikon Pesawat Kertas -->
        <svg viewBox="0 0 24 24" class="icon-send">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
        </svg>
      </button>
    </div>
  </form>


</body>

</html>
