<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<style>
  body {
    color: #fff;
  }

  /* =========================================================
   1. DESAIN MOBILE (Default)
========================================================= */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 24px;
    background-color: #121212;
    border-bottom: 2px solid salmon;
  }

  /* --- Tombol Hamburger --- */
  .hamburger {
    display: flex;
    flex-direction: column;
    gap: 5px;
    /* Jarak antar garis */
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 4px;
    z-index: 100;
    /* Memastikan tombol selalu di atas menu overlay */
  }

  /* Garis-garis pada hamburger */
  .hamburger .bar {
    width: 28px;
    height: 3px;
    background-color: #000;
    border-radius: 4px;
    transition: all 0.3s ease-in-out;
  }

  /* Animasi Hamburger menjadi huruf "X" saat aktif */
  .hamburger.is-active .bar:nth-child(1) {
    transform: translateY(8px) rotate(45deg);
  }

  .hamburger.is-active .bar:nth-child(2) {
    opacity: 0;
    /* Garis tengah menghilang */
  }

  .hamburger.is-active .bar:nth-child(3) {
    transform: translateY(-8px) rotate(-45deg);
  }

  /* --- Menu Navigasi Mobile --- */
  .nav-menu {
    position: absolute;
    top: 100%;
    /* Turun ke bawah header */
    left: -100%;
    /* Sembunyikan menu di luar layar sebelah kiri */
    width: 100%;
    background-color: #fff;
    border-bottom: 2px solid #000;
    transition: 0.3s ease-in-out;
    /* Transisi slide yang mulus */
  }

  /* Class saat menu dibuka via JavaScript */
  .nav-menu.is-active {
    left: 0;
  }

  .nav-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    text-align: center;
  }

  .nav-list li a {
    display: block;
    padding: 16px;
    text-decoration: none;
    color: #000;
    font-weight: bold;
  }

  /* =========================================================
   2. DESAIN LAPTOP / DESKTOP (Breakpoint)
========================================================= */
  @media (min-width: 768px) {

    /* Sembunyikan tombol hamburger di layar besar */
    .hamburger {
      display: none;
    }

    /* Ubah menu menjadi horizontal */
    .nav-menu {
      position: static;
      /* Kembalikan ke posisi normal dokumen */
      width: auto;
      border-bottom: none;
    }

    .nav-list {
      flex-direction: row;
      /* Jejerkan ke samping */
      gap: 24px;
    }

    .nav-list li a {
      padding: 0;
      /* Hapus padding mobile */
    }
  }
</style>

<body>

  <header class="header">
    <div class="logo">Portfolioku</div>

    <!-- 
    aria-controls: Memberitahu screen reader elemen apa yang dikontrol tombol ini 
    aria-expanded: Status menu (terbuka/tertutup)
    aria-label: Deskripsi untuk pengguna tuna netra
  -->
    <button class="hamburger" aria-expanded="false" aria-controls="nav-menu" aria-label="Buka navigasi">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>

    <nav id="nav-menu" class="nav-menu">
      <ul class="nav-list">
        <li><a href="#about">About</a></li>
        <li><a href="#projects">Projects</a></li>
        <li><a href="#skills">Skills</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <script>// 1. Tangkap elemen dari HTML
    const hamburger = document.querySelector(".hamburger");
    const navMenu = document.querySelector(".nav-menu");

    // 2. Tambahkan event listener untuk klik
    hamburger.addEventListener("click", () => {
      // Toggle class 'is-active' untuk menjalankan animasi CSS
      hamburger.classList.toggle("is-active");
      navMenu.classList.toggle("is-active");

      // Toggle aria-expanded untuk aksesibilitas (Screen Reader)
      const isExpanded = hamburger.getAttribute("aria-expanded") === "true";
      hamburger.setAttribute("aria-expanded", !isExpanded);
    });

    // 3. (Opsional tapi penting) Menutup menu saat salah satu link di klik
    document.querySelectorAll(".nav-list a").forEach(link => {
      link.addEventListener("click", () => {
        hamburger.classList.remove("is-active");
        navMenu.classList.remove("is-active");
        hamburger.setAttribute("aria-expanded", false);
      });
    });</script>

</body>

</html>
